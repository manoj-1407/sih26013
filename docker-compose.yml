version: "3.9"

services:
  geosamanvay:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: geosamanvay
    ports:
      - "8013:8013"
    volumes:
      - ./data:/app/data
    environment:
      - GS_DATA_DIR=/app/data
      - GS_DEMO_MODE=1
      - GS_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8013/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Development-only: hot-reload backend
  geosamanvay-dev:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: geosamanvay-dev
    ports:
      - "8014:8013"
    volumes:
      - ./backend:/app/backend
      - ./data:/app/data
      - ./frontend/dist:/app/static
    environment:
      - GS_DATA_DIR=/app/data
      - GS_DEMO_MODE=1
      - GS_ENV=development
    command: uvicorn app.main:app --host 0.0.0.0 --port 8013 --reload
    profiles: ["dev"]
